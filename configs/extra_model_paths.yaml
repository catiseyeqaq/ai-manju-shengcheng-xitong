# Register MiniMax-H3 weights stored on local disk into ComfyUI.
# Runtime models live under /root/models/... ; /workdata is backup only.

minimax_h3:
    base_path: /root/models/MiniMax-H3-ComfyUI
    is_default: true
    diffusion_models: diffusion_models/
    text_encoders: text_encoders/
    vae: vae/

# Also keep the default ComfyUI models tree (includes symlinks).
comfyui_local:
    base_path: /root/ComfyUI/
    checkpoints: models/checkpoints/
    configs: models/configs/
    loras: models/loras/
    vae: models/vae/
    text_encoders: |
         models/text_encoders/
         models/clip/
    diffusion_models: |
         models/unet/
         models/diffusion_models/
    clip_vision: models/clip_vision/
    embeddings: models/embeddings/
    controlnet: models/controlnet/
    upscale_models: models/upscale_models/
    audio_encoders: models/audio_encoders/
