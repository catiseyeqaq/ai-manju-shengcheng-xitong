name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile scripts and custom nodes (syntax check)
        run: python -B -m compileall -q scripts custom_nodes

      - name: Validate workflow JSON
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = []
          for f in glob.glob("workflows/**/*.json", recursive=True):
              try:
                  json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              print("Invalid JSON:", bad)
              sys.exit(1)
          print("All workflow JSON valid")
          PY
